services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradesystem
      POSTGRES_USER: tradesystem
      POSTGRES_PASSWORD: tradesystem_dev_password
    volumes:
      - trade-system-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesystem -d tradesystem"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trade-agent-network

  api:
    container_name: intelligence-trade-api
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__TradeSystem=Host=postgres;Port=5432;Database=tradesystem;Username=tradesystem;Password=tradesystem_dev_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      trade-agent-network:
        aliases:
          - intelligence-trade-api

volumes:
  trade-system-postgres-data:

networks:
  trade-agent-network:
    external: true