services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradesystem
      POSTGRES_USER: tradesystem
      POSTGRES_PASSWORD: tradesystem_dev_password
    volumes:
      - trade-system-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesystem -d tradesystem"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trade-agent-network

  api:
    container_name: intelligence-trade-api
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Authentication__Issuer=http://localhost:8081
      - Authentication__MetadataAddress=http://identity:8080/.well-known/openid-configuration
      - Authentication__BackchannelBaseAddress=http://identity:8080
      - Authentication__Audience=intelligence-trade-api
      - CredentialProtection__ActiveKeyId=local_v1
      - CredentialProtection__Keys__local_v1=${TRADE_CREDENTIAL_KEY:?Set TRADE_CREDENTIAL_KEY to a Base64-encoded 32-byte key}
      - ConnectionStrings__TradeSystem=Host=postgres;Port=5432;Database=tradesystem;Username=tradesystem;Password=tradesystem_dev_password
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      trade-agent-network:
        aliases:
          - intelligence-trade-api

  identity-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tradesystem
      PGPASSWORD: tradesystem_dev_password
      PGDATABASE: tradesystem
    command:
      - sh
      - -ec
      - |
        until pg_isready -U "$$PGUSER" -d "$$PGDATABASE"; do
          sleep 1
        done
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'tradesystem_identity'" | grep -q 1; then
          createdb -O "$$PGUSER" tradesystem_identity
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - trade-agent-network

  identity-migrations:
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Identity.Migrations/Dockerfile
    environment:
      - ConnectionStrings__TradeSystemIdentity=Host=postgres;Port=5432;Database=tradesystem_identity;Username=tradesystem;Password=tradesystem_dev_password
    depends_on:
      postgres:
        condition: service_healthy
      identity-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - trade-agent-network

  identity:
    container_name: intelligence-trade-identity
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Identity/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__TradeSystemIdentity=Host=postgres;Port=5432;Database=tradesystem_identity;Username=tradesystem;Password=tradesystem_dev_password
      - Identity__Issuer=http://localhost:8081
      - Identity__WebBffClient__Enabled=true
      - Identity__WebBffClient__ClientId=trade-web-bff
      - Identity__WebBffClient__ClientSecret=${TRADE_WEB_BFF_CLIENT_SECRET:?Set TRADE_WEB_BFF_CLIENT_SECRET to a random Web BFF client secret}
      - Identity__WebBffClient__RedirectUris__0=http://localhost:8082/signin-oidc
      - Identity__WebBffClient__PostLogoutRedirectUris__0=http://localhost:8082/signout-callback-oidc
      - Identity__DevelopmentUser__Enabled=true
      - Identity__DevelopmentUser__Username=${TRADE_WEB_DEV_USERNAME:-trade-dev-user}
      - Identity__DevelopmentUser__Password=${TRADE_WEB_DEV_PASSWORD:?Set TRADE_WEB_DEV_PASSWORD to a local development user password}
    depends_on:
      postgres:
        condition: service_healthy
      identity-migrations:
        condition: service_completed_successfully
    networks:
      trade-agent-network:
        aliases:
          - intelligence-trade-identity

  # BFF не публикует host port: browser обращается к нему только через frontend на том же origin.
  bff:
    container_name: intelligence-trade-bff
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Bff/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Bff__Oidc__Authority=http://localhost:8081
      - Bff__Oidc__MetadataAddress=http://identity:8080/.well-known/openid-configuration
      - Bff__Oidc__BackchannelBaseAddress=http://identity:8080
      - Bff__Oidc__ClientId=trade-web-bff
      - Bff__Oidc__ClientSecret=${TRADE_WEB_BFF_CLIENT_SECRET:?Set TRADE_WEB_BFF_CLIENT_SECRET to a random Web BFF client secret}
      - Bff__Api__BaseAddress=http://api:8080
      # Private range Docker bridge networks: forwarded headers принимаются только от container proxy.
      - Bff__ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
    depends_on:
      identity:
        condition: service_started
      api:
        condition: service_started
    networks:
      trade-agent-network:
        aliases:
          - intelligence-trade-bff

  frontend:
    container_name: intelligence-trade-web
    build:
      context: ../frontend/intelligence-trade-web
    ports:
      - "8082:8080"
    environment:
      - BFF_UPSTREAM=http://bff:8080
    depends_on:
      bff:
        condition: service_started
    networks:
      trade-agent-network:
        aliases:
          - intelligence-trade-web

  auth-test-seeder:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: src/Intelligence.TradeSystem.Authentication.TestSeeder/Dockerfile
    environment:
      - ConnectionStrings__TradeSystemIdentity=Host=postgres;Port=5432;Database=tradesystem_identity;Username=tradesystem;Password=tradesystem_dev_password
      - TestSeeder__Username=compose-smoke-user
      - TestSeeder__Password=Compose-smoke-password-123
      - TestSeeder__ClientId=compose-smoke-client
      - TestSeeder__RedirectUri=http://client.test/callback
    depends_on:
      identity:
        condition: service_started
    restart: "no"
    networks:
      - trade-agent-network

volumes:
  trade-system-postgres-data:

networks:
  trade-agent-network:
    name: trade-agent-network