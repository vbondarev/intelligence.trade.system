name: Build and Test

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Build
        run: dotnet build backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Test
        run: dotnet test backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build API
        run: docker build -f backend/src/Intelligence.TradeSystem.Api/Dockerfile -t intelligence-trade-system-api:ci backend

      - name: Docker build Identity
        run: docker build -f backend/src/Intelligence.TradeSystem.Identity/Dockerfile -t intelligence-trade-system-identity:ci backend

      - name: Docker build Identity migrations
        run: docker build -f backend/src/Intelligence.TradeSystem.Identity.Migrations/Dockerfile -t intelligence-trade-system-identity-migrations:ci backend

      - name: Start Compose authentication stack
        run: docker compose -f backend/compose.yaml up -d --build postgres identity-migrations identity api

      - name: Smoke test Identity discovery and JWKS
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8081/.well-known/openid-configuration; then
              exit 0
            fi

            echo "Identity is not ready yet. Retry $i/10..."
            sleep 3
          done

          docker compose -f backend/compose.yaml logs identity-migrations identity
          exit 1

      - name: Smoke test Identity JWKS
        run: curl --fail http://localhost:8081/.well-known/jwks

      - name: Smoke test API
        run: curl --fail http://localhost:8080/alive

      - name: Stop authentication stack
        if: always()
        run: docker compose -f backend/compose.yaml down -v