name: Build and Test

on:
  push:
    branches: [ develop, main, 'validation/254-buildkit-a' ]
  pull_request:
    types: [ opened, edited, reopened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      ci_path: ${{ steps.classify.outputs.ci_path }}
      diff_base_sha: ${{ steps.classify.outputs.diff_base_sha }}
      diff_head_sha: ${{ steps.classify.outputs.diff_head_sha }}
      reason: ${{ steps.classify.outputs.reason }}
      reuse_eligible: ${{ steps.snapshot.outputs.eligible }}
      snapshot: ${{ steps.snapshot.outputs.digest }}

    steps:
      - name: Checkout classified ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          diff_base_sha=""
          diff_head_sha=""
          changed_paths=()

          commit_exists() {
            git cat-file -e "$1^{commit}" 2>/dev/null
          }

          is_whitelisted() {
            case "$1" in
              *.md|README.md|ROADMAP.md|AGENTS.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/copilot-instructions.md|.github/instructions/*|.github/pull_request_template.md|.agents/skills/README.md|.agents/skills/trade-system-discovery/SKILL.md|.agents/skills/trade-system-delivery/SKILL.md|.agents/skills/trade-system-pr-review/SKILL.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          emit_route() {
            local ci_path="$1"
            local reason="$2"

            {
              printf 'ci_path=%s\n' "$ci_path"
              printf 'diff_base_sha=%s\n' "$diff_base_sha"
              printf 'diff_head_sha=%s\n' "$diff_head_sha"
              printf 'reason=%s\n' "$reason"
            } >> "$GITHUB_OUTPUT"

            {
              echo "## CI path selection"
              echo "- Event: \`$EVENT_NAME\`"
              case "$EVENT_NAME" in
                pull_request)
                  echo "- Event base SHA: \`$PR_BASE_SHA\`"
                  echo "- Event head SHA: \`$PR_HEAD_SHA\`"
                  ;;
                push)
                  echo "- Event before SHA: \`$PUSH_BEFORE_SHA\`"
                  echo "- Event after SHA: \`$PUSH_AFTER_SHA\`"
                  ;;
              esac
              echo "- Selected path: \`$ci_path\`"
              echo "- Reason: $reason"
              if [[ -n "$diff_base_sha" && -n "$diff_head_sha" ]]; then
                echo "- Diff range: \`$diff_base_sha..$diff_head_sha\`"
              fi
              echo "### Changed files"
              if (( ${#changed_paths[@]} == 0 )); then
                echo "- No classified paths."
              else
                for changed_path in "${changed_paths[@]}"; do
                  printf -- '- `%q`\n' "$changed_path"
                done
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          select_full() {
            diff_base_sha=""
            diff_head_sha=""
            emit_route full "$1"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
                select_full "Pull request event did not provide both revision SHAs."
              fi
              if ! commit_exists "$PR_BASE_SHA" || ! commit_exists "$PR_HEAD_SHA"; then
                select_full "Pull request revision is unavailable in the checkout."
              fi
              if ! diff_base_sha="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"; then
                select_full "Unable to calculate the pull request merge base."
              fi
              diff_head_sha="$PR_HEAD_SHA"
              ;;
            push)
              if [[ -z "$PUSH_BEFORE_SHA" || -z "$PUSH_AFTER_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                select_full "Push event does not provide a trusted before/after range."
              fi
              if ! commit_exists "$PUSH_BEFORE_SHA" || ! commit_exists "$PUSH_AFTER_SHA"; then
                select_full "Push revision is unavailable in the checkout."
              fi
              diff_base_sha="$PUSH_BEFORE_SHA"
              diff_head_sha="$PUSH_AFTER_SHA"
              ;;
            workflow_dispatch)
              select_full "workflow_dispatch has no trusted diff range."
              ;;
            *)
              select_full "Unsupported event type."
              ;;
          esac

          changed_paths_file="$RUNNER_TEMP/changed-paths"
          if ! git diff --no-renames --name-only -z "$diff_base_sha" "$diff_head_sha" > "$changed_paths_file"; then
            select_full "Unable to calculate the changed-file list."
          fi

          while IFS= read -r -d '' changed_path; do
            changed_paths+=("$changed_path")
          done < "$changed_paths_file"

          if (( ${#changed_paths[@]} == 0 )); then
            select_full "The changed-file range is empty."
          fi

          for changed_path in "${changed_paths[@]}"; do
            if ! is_whitelisted "$changed_path"; then
              emit_route full "At least one changed path is outside the documentation/instructions whitelist."
              exit 0
            fi
          done

          emit_route docs "All changed paths are in the documentation/instructions whitelist."

      - name: Identify the pull request snapshot
        id: snapshot
        if: github.event_name == 'pull_request'
        env:
          CI_PATH: ${{ steps.classify.outputs.ci_path }}
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import re

          try:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              pr = event["pull_request"]
              repo_id, number = event["repository"]["id"], pr["number"]
              head, base = pr["head"]["sha"], pr["base"]["sha"]
              base_ref, merge = pr["base"]["ref"], os.environ["GITHUB_SHA"]
          except (OSError, ValueError, TypeError, KeyError):
              print("Incomplete pull request snapshot; using normal CI.")
              raise SystemExit(0)
          ci_path = os.environ["CI_PATH"]
          changes = event.get("changes")
          eligible = (
              event.get("action") == "edited"
              and isinstance(changes, dict) and changes.keys() == {"body"}
              and isinstance(changes["body"], dict) and "from" in changes["body"]
              and isinstance(changes["body"]["from"], (str, type(None)))
              and "body" in pr and isinstance(pr["body"], (str, type(None)))
              and changes["body"]["from"] != pr["body"]
          )
          if (
              type(repo_id) is not int or repo_id < 1
              or type(number) is not int or number < 1
              or not isinstance(base_ref, str) or not base_ref
              or os.environ["GITHUB_REF"] != f"refs/pull/{number}/merge"
              or ci_path not in {"docs", "full"}
              or not all(isinstance(s, str) and re.fullmatch(r"[0-9a-f]{40}", s)
                         for s in (head, base, merge))
          ):
              print("Invalid pull request snapshot; using normal CI.")
              raise SystemExit(0)
          payload = [1, repo_id, number, head, base_ref, base, merge, ci_path]
          digest = sha256(json.dumps(payload, separators=(",", ":")).encode("utf-8")).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"digest={digest}", file=output)
              print(f"eligible={'true' if eligible else 'false'}", file=output)
          PY

      - name: PR snapshot v1 ${{ steps.snapshot.outputs.digest }}
        if: steps.snapshot.outputs.digest != ''
        run: echo "Pull request snapshot recorded."

  pr-ci-reuse:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: needs['classify-changes'].outputs.reuse_eligible == 'true'
    permissions:
      actions: read
    outputs:
      snapshot: ${{ steps.lookup.outputs.snapshot }}
      source_run: ${{ steps.lookup.outputs.source_run }}
      source_attempt: ${{ steps.lookup.outputs.source_attempt }}
      reason: ${{ steps.lookup.outputs.reason }}
    steps:
      - name: Find a completed CI attempt for this snapshot
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT: ${{ needs['classify-changes'].outputs.snapshot }}
          CI_PATH: ${{ needs['classify-changes'].outputs.ci_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from time import monotonic
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          root = f"https://api.github.com/repos/{repo}/actions"
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          snapshot = os.environ["SNAPSHOT"]
          head = os.environ["PR_HEAD"]
          required = {"classify-changes", "agent-assets-validation", "ci-gate"}
          if os.environ["CI_PATH"] == "docs":
              required.add("docs-validation")
          else:
              required.update({
                  "Backend · Build, Tests & Coverage",
                  "Frontend · Build & Checks",
                  "Full stack · Containers & E2E (PR)",
              })
          deadline = monotonic() + 25

          def api_pages(path, key, **filters):
              page = 1
              while True:
                  remaining = deadline - monotonic()
                  if remaining <= 0:
                      raise TimeoutError
                  query = urlencode({**filters, "per_page": 100, "page": page})
                  request = Request(f"{root}/{path}?{query}", headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urlopen(request, timeout=min(remaining, 5)) as response:
                      data = json.load(response)
                      next_page = 'rel="next"' in response.headers.get("Link", "")
                  items = data[key]
                  if not isinstance(items, list):
                      raise ValueError("Unexpected GitHub API response")
                  yield from items
                  if not next_page:
                      return
                  page += 1

          def matches(run_id, attempt):
              jobs = list(api_pages(f"runs/{run_id}/attempts/{attempt}/jobs", "jobs"))
              applicable = [job for job in jobs if job["name"] in required]
              by_name = {job["name"]: job for job in applicable}
              if required != by_name.keys() or len(applicable) != len(required):
                  return False
              for job in applicable:
                  if (
                      job["run_id"] != run_id or job["run_attempt"] != attempt
                      or job["head_sha"] != head or job["status"] != "completed"
                      or job["conclusion"] != "success"
                  ):
                      return False
              marker = f"PR snapshot v1 {snapshot}"
              steps = [step for step in by_name["classify-changes"]["steps"]
                       if step["name"] == marker]
              return len(steps) == 1 and steps[0]["conclusion"] == "success"

          def find_source():
              # Серверный фильтр по статусу может пропустить завершённый успешный прогон, если запуски пересекаются по времени.
              for run in api_pages("workflows/build.yml/runs", "workflow_runs",
                                   event="pull_request", head_sha=head):
                  if (
                      run["run_number"] >= run_number or run["event"] != "pull_request"
                      or run["path"] != ".github/workflows/build.yml"
                      or run["head_sha"] != head or run["status"] != "completed"
                      or run["conclusion"] != "success"
                  ):
                      continue
                  run_id, attempt = run["id"], run["run_attempt"]
                  if type(run_id) is int and run_id > 0 and type(attempt) is int and attempt > 0:
                      if matches(run_id, attempt):
                          return run_id, attempt
              return None

          try:
              proof = find_source()
              reason = "verified prior attempt" if proof else "no applicable completed successful attempt"
          except (OSError, ValueError, KeyError, TypeError):
              proof = None
              reason = "lookup API error, timeout or incomplete response"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              if proof:
                  print(f"snapshot={snapshot}", file=output)
                  print(f"source_run={proof[0]}", file=output)
                  print(f"source_attempt={proof[1]}", file=output)
              print(f"reason={reason}", file=output)
          PY

  docs-validation:
    runs-on: ubuntu-latest
    needs: [classify-changes, pr-ci-reuse]
    if: >-
      !cancelled() && needs['classify-changes'].result == 'success' &&
      needs['classify-changes'].outputs.ci_path == 'docs' &&
      !(needs['pr-ci-reuse'].result == 'success' &&
      needs['pr-ci-reuse'].outputs.source_run != '' &&
      needs['pr-ci-reuse'].outputs.source_attempt != '' &&
      needs['pr-ci-reuse'].outputs.snapshot == needs['classify-changes'].outputs.snapshot)

    steps:
      - name: Checkout classified head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs['classify-changes'].outputs.diff_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate documentation diff
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ needs['classify-changes'].outputs.diff_base_sha }}
          DIFF_HEAD_SHA: ${{ needs['classify-changes'].outputs.diff_head_sha }}
          CLASSIFICATION_REASON: ${{ needs['classify-changes'].outputs.reason }}
        run: |
          set -euo pipefail

          ensure_commit() {
            local sha="$1"

            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              return
            fi

            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          }

          ensure_commit "$DIFF_BASE_SHA"
          ensure_commit "$DIFF_HEAD_SHA"
          git diff --check "$DIFF_BASE_SHA" "$DIFF_HEAD_SHA"

          {
            echo "## Documentation validation"
            echo "- Classification reason: $CLASSIFICATION_REASON"
            echo "- Validated diff range: \`$DIFF_BASE_SHA..$DIFF_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  agent-assets-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the event head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test agent-assets validator
        run: python3 .github/scripts/test-check-agent-assets.py

      - name: Validate repository agent assets
        run: python3 .github/scripts/check-agent-assets.py .

  pr-workflow-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions: {}
    outputs:
      body_digest: ${{ steps.validate.outputs.body_digest }}

    steps:
      - name: Fetch the public pull request head without credentials
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: 0
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail

          git init .
          git -c credential.helper= -c http.extraheader= fetch \
            --no-tags \
            --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/pull/${PR_NUMBER}/head"

          verify_expected_head() {
            local fetched_sha="$1"
            local expected_sha="$2"

            if [[ "$fetched_sha" != "$expected_sha" ]]; then
              echo "Fetched pull request SHA не совпадает с event head SHA." >&2
              exit 1
            fi
          }

          fetched_sha="$(git rev-parse FETCH_HEAD)"
          verify_expected_head "$fetched_sha" "$EXPECTED_HEAD_SHA"

          git checkout --detach "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Test PR workflow validator
        run: python3 .github/scripts/test-check-pr-approved-plan.py

      - name: Test PR workflow security boundary
        run: python3 .github/scripts/test-pr-workflow-security.py

      - name: Validate PR workflow links
        id: validate
        run: python3 .github/scripts/check-pr-approved-plan.py

  backend:
    name: Backend · Build, Tests & Coverage
    runs-on: ubuntu-latest
    needs: [classify-changes, pr-ci-reuse]
    if: &run_full_checks >-
      !cancelled() && needs['classify-changes'].result == 'success' &&
      needs['classify-changes'].outputs.ci_path == 'full' &&
      !(needs['pr-ci-reuse'].result == 'success' &&
      needs['pr-ci-reuse'].outputs.source_run != '' &&
      needs['pr-ci-reuse'].outputs.source_attempt != '' &&
      needs['pr-ci-reuse'].outputs.snapshot == needs['classify-changes'].outputs.snapshot)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Check NuGet vulnerabilities
        shell: bash
        run: |
          report="$RUNNER_TEMP/nuget-vulnerabilities.json"
          dotnet list backend/src/Intelligence.TradeSystem.slnx package \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 \
            --no-restore \
            --verbosity quiet > "$report"
          python3 .github/scripts/check-nuget-vulnerabilities.py "$report"

      - name: Build
        run: dotnet build backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore

      - name: Test coverage aggregator
        run: python3 .github/scripts/test-check-coverage.py

      - name: Test
        id: backend-tests
        run: dotnet test backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory backend/TestResults

      - name: Verify coverage
        shell: bash
        run: |
          python3 .github/scripts/check-coverage.py \
            backend/TestResults \
            --minimum-line-coverage 92.00

      - name: Upload test results
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.backend-tests.outcome) }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            backend/TestResults/**/*.trx
            **/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload coverage
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.backend-tests.outcome) }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  frontend:
    name: Frontend · Build & Checks
    runs-on: ubuntu-latest
    needs: [classify-changes, pr-ci-reuse]
    if: *run_full_checks
    defaults:
      run:
        working-directory: frontend/intelligence-trade-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/intelligence-trade-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/intelligence-trade-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  docker-build:
    name: Full stack · Containers & E2E
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - backend
      - frontend
    if: >-
      !cancelled() && needs['classify-changes'].result == 'success' &&
      needs.backend.result == 'success' && needs.frontend.result == 'success' &&
      needs['classify-changes'].outputs.ci_path == 'full' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps: &full_stack_steps
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up shared Buildx builder
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.2
          cache-binary: false

      - name: Select builder for Compose
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: printf 'BUILDX_BUILDER=%s\n' "$BUILDER_NAME" >> "$GITHUB_ENV"

      - name: Docker build API
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: backend
          file: backend/src/Intelligence.TradeSystem.Api/Dockerfile
          load: true
          tags: intelligence-trade-system-api:ci
          cache-from: type=gha,version=2,scope=its-254-bench-a-api,timeout=30s
          cache-to: type=gha,version=2,scope=its-254-bench-a-api,mode=max,timeout=2m,ignore-error=true

      - name: Docker build Identity
        run: docker buildx build --builder "$BUILDX_BUILDER" --load -f backend/src/Intelligence.TradeSystem.Identity/Dockerfile -t intelligence-trade-system-identity:ci backend

      - name: Docker build Identity migrations
        run: docker buildx build --builder "$BUILDX_BUILDER" --load -f backend/src/Intelligence.TradeSystem.Identity.Migrations/Dockerfile -t intelligence-trade-system-identity-migrations:ci backend

      # BFF и frontend собираются из разных contexts: ни один image не может получить файлы другого.
      - name: Docker build BFF
        run: docker buildx build --builder "$BUILDX_BUILDER" --load -f backend/src/Intelligence.TradeSystem.Bff/Dockerfile -t intelligence-trade-system-bff:ci backend

      - name: Docker build frontend
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: frontend/intelligence-trade-web
          load: true
          tags: intelligence-trade-web:ci
          cache-from: type=gha,version=2,scope=its-254-bench-a-frontend,timeout=30s
          cache-to: type=gha,version=2,scope=its-254-bench-a-frontend,mode=max,timeout=2m,ignore-error=true

      - name: Verify BFF and frontend image contents
        shell: bash
        run: |
          docker run --rm --entrypoint sh intelligence-trade-system-bff:ci -c \
            'test -f /app/Intelligence.TradeSystem.Bff.dll && test ! -e /app/wwwroot && ! command -v node && ! command -v npm'
          docker run --rm --entrypoint sh intelligence-trade-web:ci -c \
            'test -f /usr/share/nginx/html/index.html && ! command -v dotnet && ! command -v node && ! command -v npm && ! find / -xdev -name "*.dll" 2>/dev/null | grep -q .'

      - name: Verify frontend deployment settings
        run: bash .github/scripts/frontend-container-settings.sh intelligence-trade-web:ci

      - name: Generate disposable credential protection key
        run: |
          credential_key="$(openssl rand -base64 32)"
          echo "::add-mask::$credential_key"
          echo "TRADE_CREDENTIAL_KEY=$credential_key" >> "$GITHUB_ENV"
        shell: bash

      - name: Generate disposable Web BFF secrets
        run: |
          client_secret="$(openssl rand -hex 32)"
          dev_password="Dev-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$dev_password"
          echo "TRADE_WEB_BFF_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo "TRADE_WEB_DEV_PASSWORD=$dev_password" >> "$GITHUB_ENV"
        shell: bash

      - name: Verify Compose BFF trusted proxy network
        run: bash .github/scripts/compose-bff-trusted-network.sh

      - name: Start PostgreSQL in existing-business-database shape
        run: docker compose -f backend/compose.yaml up -d postgres

      - name: Provision Identity database without removing business data
        run: |
          docker compose -f backend/compose.yaml run --rm identity-db-init
          docker compose -f backend/compose.yaml run --rm identity-db-init
          test "$(docker compose -f backend/compose.yaml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '\''tradesystem'\''"')" = "1"
          docker compose -f backend/compose.yaml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '\''tradesystem_identity'\''" | grep -q 1'

      - name: Start Compose authentication stack
        run: docker compose -f backend/compose.yaml --profile ci up -d --build postgres identity-db-init identity-migrations identity api bff frontend auth-test-seeder

      - name: Smoke test Compose OAuth/OIDC and protected API
        run: bash .github/scripts/compose-auth-smoke.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/intelligence-trade-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/intelligence-trade-web/package-lock.json

      - name: Install Playwright
        working-directory: frontend/intelligence-trade-web
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      # Frontend и BFF проверяются раздельно: healthy frontend не означает доступный BFF и наоборот.
      - name: Wait for frontend and BFF
        shell: bash
        run: |
          for _ in {1..60}; do
            frontend_health="$(docker inspect --format '{{.State.Health.Status}}' intelligence-trade-web 2>/dev/null || true)"
            if [[ "$frontend_health" == "healthy" ]] \
              && docker compose -f backend/compose.yaml exec -T frontend wget -q -O /dev/null http://bff:8080/healthz \
              && curl --silent --fail --output /dev/null http://localhost:8082/bff/auth/session; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend или BFF не стали доступны." >&2
          exit 1

      - name: Verify running BFF trusted proxy network
        run: bash .github/scripts/compose-bff-trusted-network.sh --running

      - name: Smoke test public scheme through frontend proxy
        run: bash .github/scripts/frontend-public-scheme-smoke.sh

      - name: Build test-only realtime E2E driver
        run: docker compose -f backend/compose.yaml --profile ci build realtime-e2e-driver

      - name: Browser E2E Web login, session and logout
        working-directory: frontend/intelligence-trade-web
        env:
          WEB_BASE_URL: http://localhost:8082
          IDENTITY_BASE_URL: http://localhost:8081
          E2E_USERNAME: trade-dev-user
          REALTIME_E2E_ENABLED: 'true'
        run: E2E_PASSWORD="$TRADE_WEB_DEV_PASSWORD" npm run test:e2e

      - name: HTTPS BFF session cookie security gate
        run: bash .github/scripts/https-security-e2e.sh

      - name: Show Compose authentication logs on failure
        if: failure()
        run: docker compose -f backend/compose.yaml logs identity-db-init identity-migrations identity api bff frontend auth-test-seeder

      - name: Stop authentication stack
        if: always()
        run: docker compose -f backend/compose.yaml down -v

  docker-build-pr:
    name: Full stack · Containers & E2E (PR)
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - frontend
    if: >-
      !cancelled() && needs['classify-changes'].result == 'success' &&
      needs.frontend.result == 'success' &&
      needs['classify-changes'].outputs.ci_path == 'full' && github.event_name == 'pull_request'
    steps: *full_stack_steps

  ci-gate:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - docs-validation
      - backend
      - frontend
      - docker-build-pr
      - docker-build
      - agent-assets-validation
      - pr-workflow-validation
      - pr-ci-reuse
    if: always()
    concurrency:
      group: ci-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject cancelled CI
        if: cancelled()
        run: exit 1

      - name: Validate selected CI path
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIER_RESULT: ${{ needs['classify-changes'].result }}
          CI_PATH: ${{ needs['classify-changes'].outputs.ci_path }}
          CI_SNAPSHOT: ${{ needs['classify-changes'].outputs.snapshot }}
          REUSE_RESULT: ${{ needs['pr-ci-reuse'].result }}
          REUSE_SNAPSHOT: ${{ needs['pr-ci-reuse'].outputs.snapshot }}
          SOURCE_RUN: ${{ needs['pr-ci-reuse'].outputs.source_run }}
          SOURCE_ATTEMPT: ${{ needs['pr-ci-reuse'].outputs.source_attempt }}
          REUSE_REASON: ${{ needs['pr-ci-reuse'].outputs.reason }}
          DOCS_VALIDATION_RESULT: ${{ needs['docs-validation'].result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PR_E2E_RESULT: ${{ needs['docker-build-pr'].result }}
          PUSH_E2E_RESULT: ${{ needs['docker-build'].result }}
          AGENT_ASSETS_VALIDATION_RESULT: ${{ needs['agent-assets-validation'].result }}
          PR_WORKFLOW_VALIDATION_RESULT: ${{ needs['pr-workflow-validation'].result }}
        run: |
          set -euo pipefail

          {
            echo "## CI gate"
            echo "- Selected path: \`$CI_PATH\`"
            echo "- classify-changes: \`$CLASSIFIER_RESULT\`"
            echo "- docs-validation: \`$DOCS_VALIDATION_RESULT\`"
            echo "- backend: \`$BACKEND_RESULT\`"
            echo "- frontend: \`$FRONTEND_RESULT\`"
            echo "- docker-build-pr: \`$PR_E2E_RESULT\`"
            echo "- docker-build: \`$PUSH_E2E_RESULT\`"
            echo "- agent-assets-validation: \`$AGENT_ASSETS_VALIDATION_RESULT\`"
            echo "- pr-workflow-validation: \`$PR_WORKFLOW_VALIDATION_RESULT\`"
            echo "- pr-ci-reuse: $REUSE_RESULT ${REUSE_REASON:+($REUSE_REASON)}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "Changed-file classification did not succeed." >&2
            exit 1
          fi
          if [[ "$AGENT_ASSETS_VALIDATION_RESULT" != "success" ]]; then
            echo "Проверка agent assets не пройдена." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_WORKFLOW_VALIDATION_RESULT" != "success" ]]; then
              echo "Проверка PR workflow не пройдена." >&2
              exit 1
            fi
          elif [[ "$PR_WORKFLOW_VALIDATION_RESULT" != "skipped" ]]; then
            echo "Проверка PR workflow должна быть пропущена вне pull_request." >&2
            exit 1
          fi

          if [[ "$REUSE_RESULT" == "success" && -n "$SOURCE_RUN" && -n "$SOURCE_ATTEMPT" &&
                "$REUSE_SNAPSHOT" == "$CI_SNAPSHOT" ]]; then
            if [[ "$EVENT_NAME" != "pull_request" || ! "$CI_PATH" =~ ^(docs|full)$ ||
                  ! "$CI_SNAPSHOT" =~ ^[0-9a-f]{64}$ ||
                  ! "$SOURCE_RUN" =~ ^[1-9][0-9]*$ || ! "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid prior CI attempt proof." >&2
              exit 1
            fi
            [[ "$DOCS_VALIDATION_RESULT" == "skipped" ]]
            [[ "$BACKEND_RESULT" == "skipped" ]]
            [[ "$FRONTEND_RESULT" == "skipped" ]]
            [[ "$PR_E2E_RESULT" == "skipped" ]]
            [[ "$PUSH_E2E_RESULT" == "skipped" ]]
            echo "- Reused [run $SOURCE_RUN, attempt $SOURCE_ATTEMPT]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$CI_PATH" in
            docs)
              [[ "$DOCS_VALIDATION_RESULT" == "success" ]]
              [[ "$BACKEND_RESULT" == "skipped" ]]
              [[ "$FRONTEND_RESULT" == "skipped" ]]
              [[ "$PR_E2E_RESULT" == "skipped" ]]
              [[ "$PUSH_E2E_RESULT" == "skipped" ]]
              ;;
            full)
              [[ "$DOCS_VALIDATION_RESULT" == "skipped" ]]
              [[ "$BACKEND_RESULT" == "success" ]]
              [[ "$FRONTEND_RESULT" == "success" ]]
              case "$EVENT_NAME" in
                pull_request)
                  [[ "$PR_E2E_RESULT" == "success" ]]
                  [[ "$PUSH_E2E_RESULT" == "skipped" ]]
                  ;;
                push|workflow_dispatch)
                  [[ "$PR_E2E_RESULT" == "skipped" ]]
                  [[ "$PUSH_E2E_RESULT" == "success" ]]
                  ;;
                *)
                  echo "Неподдерживаемое событие CI: $EVENT_NAME" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unknown CI path: $CI_PATH" >&2
              exit 1
              ;;
          esac

      - name: Check that validated pull request metadata is current
        if: github.event_name == 'pull_request'
        env:
          BODY_DIGEST: ${{ needs['pr-workflow-validation'].outputs.body_digest }}
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def revision(pr, merge):
              return (pr["base"]["repo"]["id"], pr["number"], pr["head"]["sha"],
                      pr["base"]["ref"], pr["base"]["sha"], merge)

          try:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              expected = event["pull_request"]
              repo = os.environ["GITHUB_REPOSITORY"]
              number = int(expected["number"])
              request = Request(f"https://api.github.com/repos/{repo}/pulls/{number}", headers={
                  "Accept": "application/vnd.github+json",
                  "Cache-Control": "no-cache",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=15) as response:
                  current = json.load(response)
              if current["state"] != "open" or revision(current, current["merge_commit_sha"]) != (
                  revision(expected, os.environ["GITHUB_SHA"])
              ):
                  raise SystemExit("Pull request snapshot changed or is unavailable.")
              body = current["body"]
              if body is not None and not isinstance(body, str):
                  raise ValueError("Invalid pull request body")
              if sha256((body or "").encode("utf-8")).hexdigest() != os.environ["BODY_DIGEST"]:
                  raise SystemExit("Pull request description fingerprint mismatch.")
              print("The validated pull request description is current.")
          except (OSError, KeyError, TypeError, ValueError):
              raise SystemExit("Unable to verify current pull request metadata.") from None
          PY
