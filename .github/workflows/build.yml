name: Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    types: [ opened, edited, reopened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      ci_path: ${{ steps.classify.outputs.ci_path }}
      diff_base_sha: ${{ steps.classify.outputs.diff_base_sha }}
      diff_head_sha: ${{ steps.classify.outputs.diff_head_sha }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: Checkout classified ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          diff_base_sha=""
          diff_head_sha=""
          changed_paths=()

          commit_exists() {
            git cat-file -e "$1^{commit}" 2>/dev/null
          }

          is_whitelisted() {
            case "$1" in
              README.md|ROADMAP.md|AGENTS.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/copilot-instructions.md|.github/instructions/*|.github/pull_request_template.md|.agents/skills/README.md|.agents/skills/trade-system-discovery/SKILL.md|.agents/skills/trade-system-delivery/SKILL.md|.agents/skills/trade-system-pr-review/SKILL.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          emit_route() {
            local ci_path="$1"
            local reason="$2"

            {
              printf 'ci_path=%s\n' "$ci_path"
              printf 'diff_base_sha=%s\n' "$diff_base_sha"
              printf 'diff_head_sha=%s\n' "$diff_head_sha"
              printf 'reason=%s\n' "$reason"
            } >> "$GITHUB_OUTPUT"

            {
              echo "## CI path selection"
              echo "- Event: \`$EVENT_NAME\`"
              case "$EVENT_NAME" in
                pull_request)
                  echo "- Event base SHA: \`$PR_BASE_SHA\`"
                  echo "- Event head SHA: \`$PR_HEAD_SHA\`"
                  ;;
                push)
                  echo "- Event before SHA: \`$PUSH_BEFORE_SHA\`"
                  echo "- Event after SHA: \`$PUSH_AFTER_SHA\`"
                  ;;
              esac
              echo "- Selected path: \`$ci_path\`"
              echo "- Reason: $reason"
              if [[ -n "$diff_base_sha" && -n "$diff_head_sha" ]]; then
                echo "- Diff range: \`$diff_base_sha..$diff_head_sha\`"
              fi
              echo "### Changed files"
              if (( ${#changed_paths[@]} == 0 )); then
                echo "- No classified paths."
              else
                for changed_path in "${changed_paths[@]}"; do
                  printf -- '- `%q`\n' "$changed_path"
                done
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          select_full() {
            diff_base_sha=""
            diff_head_sha=""
            emit_route full "$1"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
                select_full "Pull request event did not provide both revision SHAs."
              fi
              if ! commit_exists "$PR_BASE_SHA" || ! commit_exists "$PR_HEAD_SHA"; then
                select_full "Pull request revision is unavailable in the checkout."
              fi
              if ! diff_base_sha="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"; then
                select_full "Unable to calculate the pull request merge base."
              fi
              diff_head_sha="$PR_HEAD_SHA"
              ;;
            push)
              if [[ -z "$PUSH_BEFORE_SHA" || -z "$PUSH_AFTER_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                select_full "Push event does not provide a trusted before/after range."
              fi
              if ! commit_exists "$PUSH_BEFORE_SHA" || ! commit_exists "$PUSH_AFTER_SHA"; then
                select_full "Push revision is unavailable in the checkout."
              fi
              diff_base_sha="$PUSH_BEFORE_SHA"
              diff_head_sha="$PUSH_AFTER_SHA"
              ;;
            workflow_dispatch)
              select_full "workflow_dispatch has no trusted diff range."
              ;;
            *)
              select_full "Unsupported event type."
              ;;
          esac

          changed_paths_file="$RUNNER_TEMP/changed-paths"
          if ! git diff --no-renames --name-only -z "$diff_base_sha" "$diff_head_sha" > "$changed_paths_file"; then
            select_full "Unable to calculate the changed-file list."
          fi

          while IFS= read -r -d '' changed_path; do
            changed_paths+=("$changed_path")
          done < "$changed_paths_file"

          if (( ${#changed_paths[@]} == 0 )); then
            select_full "The changed-file range is empty."
          fi

          for changed_path in "${changed_paths[@]}"; do
            if ! is_whitelisted "$changed_path"; then
              emit_route full "At least one changed path is outside the documentation/instructions whitelist."
              exit 0
            fi
          done

          emit_route docs "All changed paths are in the documentation/instructions whitelist."

  docs-validation:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: needs['classify-changes'].outputs.ci_path == 'docs'

    steps:
      - name: Checkout classified head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs['classify-changes'].outputs.diff_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate documentation diff
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ needs['classify-changes'].outputs.diff_base_sha }}
          DIFF_HEAD_SHA: ${{ needs['classify-changes'].outputs.diff_head_sha }}
          CLASSIFICATION_REASON: ${{ needs['classify-changes'].outputs.reason }}
        run: |
          set -euo pipefail

          ensure_commit() {
            local sha="$1"

            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              return
            fi

            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          }

          ensure_commit "$DIFF_BASE_SHA"
          ensure_commit "$DIFF_HEAD_SHA"
          git diff --check "$DIFF_BASE_SHA" "$DIFF_HEAD_SHA"

          {
            echo "## Documentation validation"
            echo "- Classification reason: $CLASSIFICATION_REASON"
            echo "- Validated diff range: \`$DIFF_BASE_SHA..$DIFF_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  agent-assets-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the event head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test agent-assets validator
        run: python3 .github/scripts/test-check-agent-assets.py

      - name: Validate repository agent assets
        run: python3 .github/scripts/check-agent-assets.py .

  pr-workflow-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions: {}

    steps:
      - name: Fetch the public pull request head without credentials
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: 0
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail

          git init .
          git -c credential.helper= -c http.extraheader= fetch \
            --no-tags \
            --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/pull/${PR_NUMBER}/head"

          verify_expected_head() {
            local fetched_sha="$1"
            local expected_sha="$2"

            if [[ "$fetched_sha" != "$expected_sha" ]]; then
              echo "Fetched pull request SHA не совпадает с event head SHA." >&2
              exit 1
            fi
          }

          fetched_sha="$(git rev-parse FETCH_HEAD)"
          verify_expected_head "$fetched_sha" "$EXPECTED_HEAD_SHA"

          git checkout --detach "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Test PR workflow validator
        run: python3 .github/scripts/test-check-pr-approved-plan.py

      - name: Test PR workflow security boundary
        run: python3 .github/scripts/test-pr-workflow-security.py

      - name: Validate PR workflow links
        run: python3 .github/scripts/check-pr-approved-plan.py

  build:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: needs['classify-changes'].outputs.ci_path == 'full'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Check NuGet vulnerabilities
        shell: bash
        run: |
          report="$RUNNER_TEMP/nuget-vulnerabilities.json"
          dotnet list backend/src/Intelligence.TradeSystem.slnx package \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 \
            --no-restore \
            --verbosity quiet > "$report"
          python3 .github/scripts/check-nuget-vulnerabilities.py "$report"

      - name: Build
        run: dotnet build backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: needs['classify-changes'].outputs.ci_path == 'full'
    defaults:
      run:
        working-directory: frontend/intelligence-trade-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/intelligence-trade-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/intelligence-trade-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Test coverage aggregator
        run: python3 .github/scripts/test-check-coverage.py

      - name: Test
        run: dotnet test backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore --logger trx --collect:"XPlat Code Coverage" --results-directory backend/TestResults

      - name: Verify coverage
        shell: bash
        run: |
          python3 .github/scripts/check-coverage.py \
            backend/TestResults \
            --minimum-line-coverage 92.00

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            backend/TestResults/**/*.trx
            **/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Docker build API
        run: docker build -f backend/src/Intelligence.TradeSystem.Api/Dockerfile -t intelligence-trade-system-api:ci backend

      - name: Docker build Identity
        run: docker build -f backend/src/Intelligence.TradeSystem.Identity/Dockerfile -t intelligence-trade-system-identity:ci backend

      - name: Docker build Identity migrations
        run: docker build -f backend/src/Intelligence.TradeSystem.Identity.Migrations/Dockerfile -t intelligence-trade-system-identity-migrations:ci backend

      # BFF и frontend собираются из разных contexts: ни один image не может получить файлы другого.
      - name: Docker build BFF
        run: docker build -f backend/src/Intelligence.TradeSystem.Bff/Dockerfile -t intelligence-trade-system-bff:ci backend

      - name: Docker build frontend
        run: docker build -t intelligence-trade-web:ci frontend/intelligence-trade-web

      - name: Verify BFF and frontend image contents
        shell: bash
        run: |
          docker run --rm --entrypoint sh intelligence-trade-system-bff:ci -c \
            'test -f /app/Intelligence.TradeSystem.Bff.dll && test ! -e /app/wwwroot && ! command -v node && ! command -v npm'
          docker run --rm --entrypoint sh intelligence-trade-web:ci -c \
            'test -f /usr/share/nginx/html/index.html && ! command -v dotnet && ! command -v node && ! command -v npm && ! find / -xdev -name "*.dll" 2>/dev/null | grep -q .'

      - name: Verify frontend deployment settings
        run: bash .github/scripts/frontend-container-settings.sh intelligence-trade-web:ci

      - name: Generate disposable credential protection key
        run: |
          credential_key="$(openssl rand -base64 32)"
          echo "::add-mask::$credential_key"
          echo "TRADE_CREDENTIAL_KEY=$credential_key" >> "$GITHUB_ENV"
        shell: bash

      - name: Generate disposable Web BFF secrets
        run: |
          client_secret="$(openssl rand -hex 32)"
          dev_password="Dev-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$dev_password"
          echo "TRADE_WEB_BFF_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo "TRADE_WEB_DEV_PASSWORD=$dev_password" >> "$GITHUB_ENV"
        shell: bash

      - name: Start PostgreSQL in existing-business-database shape
        run: docker compose -f backend/compose.yaml up -d postgres

      - name: Provision Identity database without removing business data
        run: |
          docker compose -f backend/compose.yaml run --rm identity-db-init
          docker compose -f backend/compose.yaml run --rm identity-db-init
          test "$(docker compose -f backend/compose.yaml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '\''tradesystem'\''"')" = "1"
          docker compose -f backend/compose.yaml exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '\''tradesystem_identity'\''" | grep -q 1'

      - name: Start Compose authentication stack
        run: docker compose -f backend/compose.yaml --profile ci up -d --build postgres identity-db-init identity-migrations identity api bff frontend auth-test-seeder

      - name: Smoke test Compose OAuth/OIDC and protected API
        run: bash .github/scripts/compose-auth-smoke.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/intelligence-trade-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/intelligence-trade-web/package-lock.json

      - name: Install Playwright
        working-directory: frontend/intelligence-trade-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Frontend и BFF проверяются раздельно: healthy frontend не означает доступный BFF и наоборот.
      - name: Wait for frontend and BFF
        shell: bash
        run: |
          for _ in {1..60}; do
            frontend_health="$(docker inspect --format '{{.State.Health.Status}}' intelligence-trade-web 2>/dev/null || true)"
            if [[ "$frontend_health" == "healthy" ]] \
              && docker compose -f backend/compose.yaml exec -T frontend wget -q -O /dev/null http://bff:8080/healthz \
              && curl --silent --fail --output /dev/null http://localhost:8082/bff/auth/session; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend или BFF не стали доступны." >&2
          exit 1

      - name: Smoke test public scheme through frontend proxy
        run: bash .github/scripts/frontend-public-scheme-smoke.sh

      - name: Browser E2E Web login, session and logout
        working-directory: frontend/intelligence-trade-web
        env:
          WEB_BASE_URL: http://localhost:8082
          IDENTITY_BASE_URL: http://localhost:8081
          E2E_USERNAME: trade-dev-user
        run: E2E_PASSWORD="$TRADE_WEB_DEV_PASSWORD" npm run test:e2e

      - name: Show Compose authentication logs on failure
        if: failure()
        run: docker compose -f backend/compose.yaml logs identity-db-init identity-migrations identity api bff frontend auth-test-seeder

      - name: Stop authentication stack
        if: always()
        run: docker compose -f backend/compose.yaml down -v

  ci-gate:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - docs-validation
      - build
      - frontend
      - test
      - docker-build
      - agent-assets-validation
      - pr-workflow-validation
    if: always()

    steps:
      - name: Validate selected CI path
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIER_RESULT: ${{ needs['classify-changes'].result }}
          CI_PATH: ${{ needs['classify-changes'].outputs.ci_path }}
          DOCS_VALIDATION_RESULT: ${{ needs['docs-validation'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          AGENT_ASSETS_VALIDATION_RESULT: ${{ needs['agent-assets-validation'].result }}
          PR_WORKFLOW_VALIDATION_RESULT: ${{ needs['pr-workflow-validation'].result }}
        run: |
          set -euo pipefail

          {
            echo "## CI gate"
            echo "- Selected path: \`$CI_PATH\`"
            echo "- classify-changes: \`$CLASSIFIER_RESULT\`"
            echo "- docs-validation: \`$DOCS_VALIDATION_RESULT\`"
            echo "- build: \`$BUILD_RESULT\`"
            echo "- frontend: \`$FRONTEND_RESULT\`"
            echo "- test: \`$TEST_RESULT\`"
            echo "- docker-build: \`$DOCKER_BUILD_RESULT\`"
            echo "- agent-assets-validation: \`$AGENT_ASSETS_VALIDATION_RESULT\`"
            echo "- pr-workflow-validation: \`$PR_WORKFLOW_VALIDATION_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "Changed-file classification did not succeed." >&2
            exit 1
          fi
          if [[ "$AGENT_ASSETS_VALIDATION_RESULT" != "success" ]]; then
            echo "Проверка agent assets не пройдена." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_WORKFLOW_VALIDATION_RESULT" != "success" ]]; then
              echo "Проверка PR workflow не пройдена." >&2
              exit 1
            fi
          elif [[ "$PR_WORKFLOW_VALIDATION_RESULT" != "skipped" ]]; then
            echo "Проверка PR workflow должна быть пропущена вне pull_request." >&2
            exit 1
          fi

          case "$CI_PATH" in
            docs)
              [[ "$DOCS_VALIDATION_RESULT" == "success" ]]
              [[ "$BUILD_RESULT" == "skipped" ]]
              [[ "$FRONTEND_RESULT" == "skipped" ]]
              [[ "$TEST_RESULT" == "skipped" ]]
              [[ "$DOCKER_BUILD_RESULT" == "skipped" ]]
              ;;
            full)
              [[ "$DOCS_VALIDATION_RESULT" == "skipped" ]]
              [[ "$BUILD_RESULT" == "success" ]]
              [[ "$FRONTEND_RESULT" == "success" ]]
              [[ "$TEST_RESULT" == "success" ]]
              [[ "$DOCKER_BUILD_RESULT" == "success" ]]
              ;;
            *)
              echo "Unknown CI path: $CI_PATH" >&2
              exit 1
              ;;
          esac