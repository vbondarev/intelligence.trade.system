name: Build and Test

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Build
        run: dotnet build backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/src/Intelligence.TradeSystem.slnx

      - name: Test
        run: dotnet test backend/src/Intelligence.TradeSystem.slnx --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build API
        run: docker build -f backend/src/Intelligence.TradeSystem.Api/Dockerfile -t intelligence-trade-system-api:ci backend

      - name: Run API container
        run: |
          docker run -d \
            --name intelligence-trade-system-api-test \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8080 \
            intelligence-trade-system-api:ci

      - name: Smoke test API
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/; then
              exit 0
            fi

            echo "API is not ready yet. Retry $i/10..."
            sleep 3
          done

          echo "API did not become ready in time."
          docker logs intelligence-trade-system-api-test
          exit 1

      - name: Stop API container
        if: always()
        run: docker rm -f intelligence-trade-system-api-test