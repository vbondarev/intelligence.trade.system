name: Trusted Plan Freshness

on:
  workflow_run:
    workflows: [ Build and Test ]
    types: [ requested, completed ]
  issue_comment:
    types: [ created, edited, deleted ]

permissions: {}

jobs:
  validate-workflow-run:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate trusted Plan freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/trusted-plan-freshness.py

  validate-issue-comment:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Revalidate linked PRs after trusted Issue comment changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/trusted-plan-freshness.py
